services:
  linkedin-bot:
    networks:
      - default
      - renderer
    environment:
      SCRAPER_BROWSER_ENABLED: ${SCRAPER_BROWSER_ENABLED:-false}
      SCRAPER_BROWSER_TOKEN: ${SCRAPER_BROWSER_TOKEN:?Set a dedicated renderer token}
      SCRAPER_BROWSER_ENABLED: ${SCRAPER_BROWSER_ENABLED:-false}
      SCRAPER_BROWSER_URL: http://scraper-browser:8787

  scraper-browser:
    build:
      context: ./browser_service
      dockerfile: Dockerfile
    image: linkedin-scraper-browser:1.63.0
    init: true
    user: pwuser
    environment:
      RENDER_TOKEN: ${SCRAPER_BROWSER_TOKEN:?Set a dedicated renderer token}
    networks:
      - renderer
    depends_on:
      - scraper-egress
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 256
        hard: 256
    stop_grace_period: 5s

  scraper-egress:
    build:
      context: ./browser_service
      dockerfile: Dockerfile.proxy
    image: linkedin-scraper-egress:local
    init: true
    user: "65532:65532"
    networks:
      - renderer
      - renderer-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    ulimits:
      nofile:
        soft: 128
        hard: 128
    stop_grace_period: 5s

networks:
  renderer:
    internal: true
  renderer-egress: {}
